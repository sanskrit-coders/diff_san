[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pull_requests_san"
version = "0.1.34"
description = "Single-pane word-flow and character-level GitHub PR review tool for Sanskrit & Indic repositories"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sanskrit Coders", email = "sanskrit-programmers@googlegroups.com"}]
keywords = ["sanskrit", "github", "pull-request", "diff", "devanagari", "vedic", "proofreading"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "fastapi>=0.100",
  "regex>=2023.0.0",
  "requests>=2.28",
  "uvicorn>=0.23",
]

[project.urls]
Homepage = "https://github.com/sanskrit-coders/diff_san"
Repository = "https://github.com/sanskrit-coders/diff_san"

[project.scripts]
pull_requests_san = "pull_requests_san.pr_review_gui:main"

[tool.setuptools.packages.find]
include = ["pull_requests_san*"]

[tool.setuptools.package-data]
pull_requests_san = ["templates/*.html", "assets/*.css", "assets/*.js"]
